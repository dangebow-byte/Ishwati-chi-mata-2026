<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" aria-label="श्री ईश्वटीची माता मंडळ अधिकृत बोधचिन्ह - श्वेत पारदर्शक">
  <defs>
    <filter id="whiteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Sacred Circular Borders in Pure White -->
  <circle cx="250" cy="250" r="240" fill="none" stroke="#FFFFFF" stroke-width="7" />
  <circle cx="250" cy="250" r="226" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6,4" opacity="0.85" />
  <circle cx="250" cy="250" r="220" fill="none" stroke="#FFFFFF" stroke-width="1.8" />

  <!-- Decorative Radiance Rays -->
  <g opacity="0.4" stroke="#FFFFFF" stroke-width="1.8">
    <line x1="250" y1="35" x2="250" y2="15" />
    <line x1="250" y1="465" x2="250" y2="485" />
    <line x1="35" y1="250" x2="15" y2="250" />
    <line x1="465" y1="250" x2="485" y2="250" />
    <line x1="98" y1="98" x2="84" y2="84" />
    <line x1="402" y1="98" x2="416" y2="84" />
    <line x1="98" y1="402" x2="84" y2="416" />
    <line x1="402" y1="402" x2="416" y2="416" />
  </g>

  <!-- Sacred Trident (Trishul) -->
  <g transform="translate(250, 115) scale(0.9)" filter="url(#whiteGlow)">
    <path d="M 0,-62 L 7,-30 L 3,30 L -3,30 L -7,-30 Z" fill="#FFFFFF" />
    <path d="M -5,0 C -26,-16 -37,-46 -29,-58 C -26,-42 -12,-20 0,-10 Z" fill="#FFFFFF" />
    <path d="M 5,0 C 26,-16 37,-46 29,-58 C 26,-42 12,-20 0,-10 Z" fill="#FFFFFF" />
    <ellipse cx="0" cy="22" rx="15" ry="4.5" fill="#FFFFFF" />
    <rect x="-2.5" y="24" width="5" height="30" fill="#FFFFFF" rx="2" />
  </g>

  <!-- Auspicious Dots (Haldi on Left, Kumkum on Right) -->
  <circle cx="155" cy="115" r="23" fill="#FFFFFF" opacity="0.9" />
  <circle cx="345" cy="115" r="23" fill="#FFFFFF" opacity="0.9" />

  <!-- Sacred Devanagari Calligraphy in Pure White -->
  <g text-anchor="middle" font-family="'Noto Sans Devanagari', 'FreeSans', 'Yatra One', serif" font-weight="900" fill="#FFFFFF">
    <text x="250" y="235" font-size="62" letter-spacing="2" filter="url(#whiteGlow)">
      ईश्वटीची
    </text>
    <text x="250" y="315" font-size="70" letter-spacing="4" filter="url(#whiteGlow)">
      माता
    </text>
    <text x="250" y="375" font-size="34" font-weight="800" letter-spacing="6">
      मंडळ
    </text>
  </g>

  <!-- Bottom Arch Inscription -->
  <path id="archBottomWhite" d="M 80,310 A 200,200 0 0,0 420,310" fill="none" stroke="none" />
  <text font-family="'Noto Sans Devanagari', 'FreeSans', serif" font-size="14" fill="#FFFFFF" font-weight="700" letter-spacing="3" text-anchor="middle">
    <textPath href="#archBottomWhite" startOffset="50%">
      || श्री ईश्वटीची माता प्रसन्न • स्थापना १९७६ ||
    </textPath>
  </text>
</svg>
