<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Outermost Gold Rim Gradient -->
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6D0" />
      <stop offset="15%" stop-color="#FFDA60" />
      <stop offset="35%" stop-color="#D09418" />
      <stop offset="50%" stop-color="#6E3F00" />
      <stop offset="65%" stop-color="#FFDF70" />
      <stop offset="85%" stop-color="#A06808" />
      <stop offset="100%" stop-color="#FFF8D8" />
    </linearGradient>

    <!-- Inner Gold Rim Gradient -->
    <linearGradient id="g2" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FFFBDC" />
      <stop offset="25%" stop-color="#E8B330" />
      <stop offset="55%" stop-color="#653600" />
      <stop offset="80%" stop-color="#FEDD65" />
      <stop offset="100%" stop-color="#925B03" />
    </linearGradient>

    <!-- Deep Maroon Background Radial Gradient -->
    <radialGradient id="bgMaroon" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#940818" />
      <stop offset="30%" stop-color="#78000E" />
      <stop offset="65%" stop-color="#4C0008" />
      <stop offset="88%" stop-color="#2B0004" />
      <stop offset="100%" stop-color="#120002" />
    </radialGradient>

    <!-- Left Circle 3D Haldi Gradient -->
    <radialGradient id="haldiGrad" cx="36%" cy="32%" r="64%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="15%" stop-color="#FFF685" />
      <stop offset="40%" stop-color="#FFBC00" />
      <stop offset="70%" stop-color="#E65200" />
      <stop offset="92%" stop-color="#B00E00" />
      <stop offset="100%" stop-color="#550000" />
    </radialGradient>

    <!-- Right Circle 3D Kumkum Gradient -->
    <radialGradient id="kumkumGrad" cx="36%" cy="32%" r="64%">
      <stop offset="0%" stop-color="#FFF4EC" />
      <stop offset="18%" stop-color="#FFA668" />
      <stop offset="44%" stop-color="#FF3400" />
      <stop offset="72%" stop-color="#CC0000" />
      <stop offset="92%" stop-color="#750000" />
      <stop offset="100%" stop-color="#380000" />
    </radialGradient>

    <!-- 3D Shadow filter for depth -->
    <filter id="hardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="5" flood-color="#260004" flood-opacity="0.95" />
    </filter>
  </defs>

  <!-- ============================================== -->
  <!-- 1. MEDALLION RIM (TRANSPARENT OUTSIDE R=495)   -->
  <!-- ============================================== -->
  <!-- Thin Outermost Dark Maroon Rim -->
  <circle cx="512" cy="512" r="496" fill="#3D0005" />
  <!-- Outer Beveled Gold Ring -->
  <circle cx="512" cy="512" r="492" fill="url(#g1)" stroke="#401E00" stroke-width="1.5" />
  <!-- Dark Groove -->
  <circle cx="512" cy="512" r="464" fill="none" stroke="#2D1400" stroke-width="3" />
  <!-- Inner Beveled Gold Ring -->
  <circle cx="512" cy="512" r="461" fill="url(#g2)" stroke="#FFF8B0" stroke-width="1" />
  <!-- Inner Edge Dark Bevel Line -->
  <circle cx="512" cy="512" r="439" fill="none" stroke="#1F0002" stroke-width="3.5" />
  <!-- Sacred Maroon Medallion Center -->
  <circle cx="512" cy="512" r="436" fill="url(#bgMaroon)" />

  <!-- ============================================== -->
  <!-- 2. RED 3D EMBOSSED BASE (OFFSET DOWNWARDS 10px) -->
