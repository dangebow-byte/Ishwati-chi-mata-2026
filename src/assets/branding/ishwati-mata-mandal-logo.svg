<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%" aria-label="श्री ईश्वटीची माता मंडळ अधिकृत बोधचिन्ह">
  <defs>
    <!-- Outer Gold Ring Metallic Linear Gradient -->
    <linearGradient id="goldOuterRimFull" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFF5B8" />
      <stop offset="18%" stop-color="#E5B235" />
      <stop offset="35%" stop-color="#9C6B12" />
      <stop offset="55%" stop-color="#FFDE6A" />
      <stop offset="75%" stop-color="#C28919" />
      <stop offset="90%" stop-color="#734204" />
      <stop offset="100%" stop-color="#FCEB9C" />
    </linearGradient>

    <!-- Inner Gold Ring Bevel Gradient -->
    <linearGradient id="goldInnerRimFull" x1="10%" y1="15%" x2="90%" y2="85%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="30%" stop-color="#D4991F" />
      <stop offset="60%" stop-color="#8A5308" />
      <stop offset="85%" stop-color="#F7D052" />
      <stop offset="100%" stop-color="#B07510" />
    </linearGradient>

    <!-- Rich Sacred Maroon Medallion Background -->
    <radialGradient id="maroonMedallionBgFull" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#A30E20" />
      <stop offset="35%" stop-color="#800614" />
      <stop offset="70%" stop-color="#52010C" />
      <stop offset="92%" stop-color="#330007" />
      <stop offset="100%" stop-color="#1F0004" />
    </radialGradient>

    <!-- Haldi 3D Spherical Radial Gradient (Sun / Yellow) -->
    <radialGradient id="haldiSphereFull" cx="38%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#FFFFF0" />
      <stop offset="15%" stop-color="#FFF275" />
      <stop offset="42%" stop-color="#FFBA00" />
      <stop offset="72%" stop-color="#E85D04" />
      <stop offset="92%" stop-color="#B71C0C" />
      <stop offset="100%" stop-color="#660A00" />
    </radialGradient>

    <!-- Kumkum 3D Spherical Radial Gradient (Moon / Vermilion) -->
    <radialGradient id="kumkumSphereFull" cx="38%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#FFF0E6" />
      <stop offset="18%" stop-color="#FFA154" />
      <stop offset="45%" stop-color="#FF3700" />
      <stop offset="75%" stop-color="#D00000" />
      <stop offset="94%" stop-color="#7A0000" />
      <stop offset="100%" stop-color="#420000" />
    </radialGradient>

    <!-- Trishul Silver-White Sheen Gradient -->
    <linearGradient id="trishulSheenFull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F4F4F6" />
      <stop offset="100%" stop-color="#E2E2E8" />
    </linearGradient>

    <!-- 3D Heavy Drop Shadow for Calligraphy & Trishul -->
    <filter id="heavy3DShadowFull" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#3B0006" flood-opacity="0.95" />
    </filter>
  </defs>

